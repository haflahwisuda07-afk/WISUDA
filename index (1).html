<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panitia Haflah dan Wisuda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Tata letak: header + tab di atas, satu kolom konten yang rapi di HP dan melebar di desktop */
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#16231f; --muted:#5d6b66;
  --brand:#0f4c45; --brand-ink:#ffffff; --accent:#d99a1e; --line:#dbe2dd;
  --good:#1f7a4d; --bad:#b3372b;
  --font-d:"Bricolage Grotesque","Segoe UI",sans-serif; --font-b:"Source Sans 3","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1815; --card:#17231f; --ink:#e8efeb; --muted:#9fb0a9; --brand:#3aa391; --brand-ink:#08201b; --accent:#e8b24a; --line:#2a3b35; --good:#4cc38a; --bad:#ef7d70; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1815; --card:#17231f; --ink:#e8efeb; --muted:#9fb0a9; --brand:#3aa391; --brand-ink:#08201b; --accent:#e8b24a; --line:#2a3b35; --good:#4cc38a; --bad:#ef7d70; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-b);}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.3rem}
h3{font-size:1.02rem}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px}
.bar{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.2rem}
.brand small{opacity:.9}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem;flex-wrap:wrap}
#saveStat{font-size:.8rem;opacity:.95}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{max-width:1000px;margin:0 auto;display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 12px;font:600 .95rem var(--font-b);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 56px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.tile .lbl{color:var(--muted);font-size:.85rem}
.tile .val{font:700 1.5rem var(--font-d);font-variant-numeric:tabular-nums}
.tile .sub{color:var(--muted);font-size:.85rem}
.good{color:var(--good)} .bad{color:var(--bad)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:9px 14px;font:600 .95rem var(--font-b);cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.small{padding:5px 9px;font-size:.85rem}
header .btn.ghost{color:var(--brand-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:1rem var(--font-b);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
textarea{resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.wait{color:var(--accent);border-color:var(--accent)} .pill.now{color:var(--brand-ink);background:var(--brand);border-color:var(--brand)}
.muted{color:var(--muted)}
.note{border-left:4px solid var(--accent);background:var(--card);padding:10px 14px;border-radius:6px;font-size:.9rem;margin-bottom:16px}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;margin-bottom:10px}
.ev .db{background:var(--brand);color:var(--brand-ink);border-radius:8px;text-align:center;padding:6px 2px;line-height:1.1}
.ev .db b{display:block;font:700 1.4rem var(--font-d)}
.ev .db span{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.ev.past{opacity:.6}
.ev h3{margin-bottom:2px}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.ev{grid-template-columns:56px 1fr}.ev .acts{grid-column:1/-1;justify-content:flex-start}}
.grp{margin:22px 0 10px;font-size:.85rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-family:var(--font-b);font-weight:600}
.org{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.org ul{list-style:none;margin:8px 0 0;padding:0}
.org li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.org li span.k{color:var(--muted);font-size:.82rem;text-align:right}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
details.jd{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.jd>summary{cursor:pointer;padding:12px 16px;font:600 1rem var(--font-d);list-style-position:inside}
details.jd .body{padding:0 16px 14px}
details.jd ol{margin:6px 0 10px;padding-left:22px}
details.jd ol ul{margin:4px 0;padding-left:18px}
details.jd li{margin:3px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;max-width:520px;width:calc(100% - 24px);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:grid;gap:12px}
.err{color:var(--bad);min-height:1.2em;font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:90%;z-index:50;display:none}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
</style>
</head>

<header><div class="bar">
  <div class="brand"><h1>Panitia Haflah dan Wisuda</h1><small>Pondok Pesantren Mamba'ul Huda · TA 1447–1448 H / 2026–2027 M</small></div>
  <div class="who"><span id="saveStat" aria-live="polite"></span><span id="whoLabel">Pengunjung</span><button class="btn ghost small" id="authBtn" type="button">Masuk</button></div>
</div></header>
<nav><div class="tabs" role="tablist" id="tabs"></div></nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<datalist id="ketList"></datalist>

<dialog id="loginDlg">
  <form id="loginForm">
    <h2>Masuk panitia</h2>
    <label for="roleSel">Peran
      <select id="roleSel">
        <option value="sekretaris">Sekretaris</option>
        <option value="bendahara_putra">Bendahara Putra</option>
        <option value="bendahara_putri">Bendahara Putri</option>
        <option value="admin">Admin (akses semua)</option>
      </select>
    </label>
    <label for="pwIn">Kata sandi
      <input id="pwIn" type="password" autocomplete="current-password">
    </label>
    <div class="err" id="loginErr" role="alert"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn outline" type="button" id="cancelLogin">Batal</button>
      <button class="btn" type="submit" id="loginGo">Masuk</button>
    </div>
    <p class="hint" id="loginHint" style="margin:0"></p>
  </form>
</dialog>

<dialog id="formDlg">
  <form id="formEl">
    <h2 id="formTitle"></h2>
    <div id="formFields" style="display:grid;gap:12px"></div>
    <div class="err" id="formErr" role="alert"></div>
    <div class="row spread">
      <button class="btn danger" type="button" id="formDel" hidden>Hapus</button>
      <span class="row" style="margin-left:auto">
        <button class="btn outline" type="button" id="formCancel">Batal</button>
        <button class="btn" type="submit">Simpan</button>
      </span>
    </div>
  </form>
</dialog>

/* ====== Helper ====== */
function $(id){return document.getElementById(id)}
function el(tag,attrs,kids){
  var n=document.createElement(tag);
  for(var k in (attrs||{})){
    if(k==="class")n.className=attrs[k];
    else if(k==="text")n.textContent=attrs[k];
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){if(c!=null)n.appendChild(typeof c==="string"?document.createTextNode(c):c)});
  return n;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function rp(n){return "Rp "+Math.round(Number(n)||0).toLocaleString("id-ID")}
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function todayD(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayDiff(a,b){return Math.round((b-a)/86400000)}
function todayISO(){var d=todayD();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtRange(m,s){
  var a=pd(m),b=pd(s||m)||a; if(!a)return "";
  var ha=HARI[a.getDay()],hb=HARI[b.getDay()];
  if(+a===+b)return ha+", "+a.getDate()+" "+BULAN[a.getMonth()]+" "+a.getFullYear();
  if(a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear())return ha+"–"+hb+", "+a.getDate()+"–"+b.getDate()+" "+BULAN[a.getMonth()]+" "+a.getFullYear();
  var ya=a.getFullYear()!==b.getFullYear()?" "+a.getFullYear():"";
  return ha+", "+a.getDate()+" "+BULAN[a.getMonth()]+ya+" – "+hb+", "+b.getDate()+" "+BULAN[b.getMonth()]+" "+b.getFullYear();
}

  clearTimeout(timers[key]);timers[key]=setTimeout(function(){flush(key)},500);
}
function flush(key){
  if(saving[key]){dirty[key]=true;return}
  saving[key]=true;dirty[key]=false;
  var body=JSON.stringify({action:"save",key:key,rev:revs[key]||"",value:state[key],role:session,password:pw});
  fetch(CONFIG.API_URL,{method:"POST",body:body})
   .then(function(r){return r.json()})
   .then(function(j){
     saving[key]=false;
     if(j.ok){revs[key]=j.rev;if(dirty[key]){flush(key)}else setStat("✓ Tersimpan");return}
     if(j.error==="conflict"){dirty[key]=false;toast("Data baru saja diubah orang lain. Data dimuat ulang, silakan ulangi perubahan.");revs[key]="";fetchAll(true).then(function(){fetchForce(key)});return}
     if(j.error==="unauthorized"||j.error==="forbidden"){logout(true);toast("Sesi tidak valid. Silakan masuk lagi.");return}
     dirty[key]=true;setStat("Gagal menyimpan ("+j.error+")","bad");
   })
   .catch(function(){saving[key]=false;dirty[key]=true;setStat("Gagal menyimpan, mencoba lagi…","bad");clearTimeout(timers[key]);timers[key]=setTimeout(function(){flush(key)},6000)});
}
function fetchForce(key){
  fetch(CONFIG.API_URL+(CONFIG.API_URL.indexOf("?")<0?"?":"&")+"t="+Date.now()).then(function(r){return r.json()}).then(function(j){
    var d=j.data&&j.data[key];if(d&&Array.isArray(d.value)){state[key]=d.value;revs[key]=d.rev;dirty[key]=false;setStat("");softRender()}
  }).catch(function(){});
}

function eventStatus(e){
  var t=todayD(),a=pd(e.mulai),b=pd(e.selesai||e.mulai)||a;

  if(t<a){var n=dayDiff(t,a);return {t:n===1?"Besok":n+" hari lagi",c:"wait",past:false,days:n}}
  if(t<=b)return {t:"Berlangsung",c:"now",past:false,days:0};
  return {t:"Selesai",c:"ok",past:true};
}

    ["No","Tanggal","Kode","Keterangan","Volume","Satuan","Harga satuan","Masuk","Keluar","Saldo"].forEach(function(h,i){hr.appendChild(el("th",{class:i>=4&&i!==5?"num":"",text:h}))});
    if(edit)hr.appendChild(el("th"));
    t.appendChild(el("thead",{},[hr]));
    var tb=el("tbody"),saldo=0;
    rows.forEach(function(r,i){
      var j=jumlah(r),m=r.jenis==="Masuk"?j:0,k=r.jenis==="Masuk"?0:j;saldo+=m-k;
      var tr=el("tr",{},[el("td",{text:String(i+1)}),el("td",{class:"nw",text:(function(){var d=pd(r.tanggal);return d?d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear():r.tanggal})()}),
        el("td",{text:r.kode}),el("td",{text:r.ket}),el("td",{class:"num",text:String(r.vol)}),el("td",{text:r.satuan||""}),
        el("td",{class:"num",text:rp(r.harga)}),el("td",{class:"num good",text:m?rp(m):""}),el("td",{class:"num bad",text:k?rp(k):""}),
        el("td",{class:"num"+(saldo<0?" bad":""),text:rp(saldo)})]);
      if(edit)tr.appendChild(el("td",{},[el("button",{class:"btn outline small",type:"button",text:"Ubah","aria-label":"Ubah transaksi "+r.ket,onclick:function(){formKas(key,r)}})]));
      tb.appendChild(tr);
    });
    t.appendChild(tb);wrap.appendChild(t);
  }
  v.appendChild(wrap);
  v.appendChild(el("p",{class:"hint",text:"Kode transaksi mengikuti buku bendahara: a, b, c untuk uang masuk; 1 sampai 11 untuk pengeluaran per pos."}));
}

/* ====== Mulai ====== */
(function init(){
  var dl=$("ketList");KET_SARAN.forEach(function(k){dl.appendChild(el("option",{value:k}))});
  initState();
  try{var r=sessionStorage.getItem("wh-role");if(r&&ROLE_LABEL[r]){session=r;pw=sessionStorage.getItem("wh-pw")||""}}catch(e){}
  var h=(location.hash||"").replace("#","");
  if(PAGES.some(function(p){return p[0]===h}))current=h;
  window.addEventListener("hashchange",function(){var x=(location.hash||"").replace("#","");if(PAGES.some(function(p){return p[0]===x})&&x!==current){current=x;render()}});
  render();
  if(!DEMO){
    fetchAll(false);
    setInterval(function(){
      var busy=KEYS.some(function(k){return dirty[k]||saving[k]});
      if(!document.hidden&&!busy)fetchAll(true);
    },90000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)fetchAll(true)});
  }
})();
})();
</script>
